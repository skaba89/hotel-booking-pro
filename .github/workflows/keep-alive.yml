name: Keep Render API Alive

# Render free tier sleeps after 15 minutes of inactivity.
# This workflow pings the /api/health endpoint every 10 minutes
# to keep the API warm and avoid cold-start delays for real users.

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes, 24/7
  workflow_dispatch:           # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API health endpoint
        run: |
          echo "Pinging Hotel SETIFANA API..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://hotel-setifana-api.onrender.com/api/health)
          echo "Response code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ API is alive"
          else
            echo "⚠️  API returned $HTTP_CODE (may be waking up)"
          fi
