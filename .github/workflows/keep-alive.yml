name: Keep Render API + Neon DB Alive

# Render free tier sleeps after 15 minutes of inactivity.
# Neon DB free tier auto-suspends after ~5 minutes of inactivity.
#
# This workflow pings BOTH endpoints every 5 minutes to prevent sleep.
# If the first ping gets a cold-start response (non-200), it retries after
# 60 seconds to confirm Render is fully awake before the next cron window.
#
# Important: GitHub Actions cron is not exact — it can be delayed by up to
# 15-30 minutes during high load. That's why we also maintain keep-warm.yml.

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes, 24/7
  workflow_dispatch:          # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # Enough for cold start + retry
    steps:
      - name: Ping health endpoint — wake Render if sleeping
        run: |
          echo "🔔 Pinging Hotel SETIFANA API health endpoint..."

          for attempt in 1 2; do
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" \
              --max-time 90 \
              https://hotel-setifana-api.onrender.com/api/health || echo "000")
            echo "Attempt $attempt → HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
              echo "✅ Render API is alive"
              break
            elif [ "$attempt" = "1" ]; then
              echo "⚠️  Got $HTTP_CODE — Render may be waking up. Waiting 60s then retrying..."
              sleep 60
            else
              echo "⚠️  Still $HTTP_CODE after retry — cold start may take longer"
            fi
          done

      - name: Ping rooms endpoint — keep Neon DB warm
        run: |
          echo "🔔 Pinging /api/rooms?limit=1 (real DB query)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            "https://hotel-setifana-api.onrender.com/api/rooms?limit=1" || echo "000")
          echo "Response: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
            echo "✅ Neon DB is alive"
          else
            echo "⚠️  DB endpoint returned $HTTP_CODE (may still be warming)"
          fi
