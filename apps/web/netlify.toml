# ===========================================
# Netlify Configuration - Hotel SETIFANA (web app)
# This config lives inside the monorepo package (base = apps/web)
# Deploy with:  netlify deploy --build --prod --filter @hotel-booking/web
# ===========================================

[build]
  # Netlify CLI runs from the monorepo root (--filter selects this package).
  # Build only the web workspace; deps are hoisted to root by npm workspaces.
  command = "npm run build --workspace=apps/web"
  publish = "apps/web/.next"

# Next.js runtime: SSR / ISR / middleware / image optimization
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"
  # Configure NEXT_PUBLIC_API_URL in the Netlify dashboard for production
  # NEXT_PUBLIC_API_URL = "https://your-api-url"

# ===========================================
# API Proxy Redirects
# Uncomment when the NestJS API is deployed
# ===========================================

# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api-url/api/:splat"
#   status = 200
#   force = true

# [[redirects]]
#   from = "/uploads/*"
#   to = "https://your-api-url/uploads/:splat"
#   status = 200
#   force = true

# ===========================================
# Security Headers
# ===========================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    X-DNS-Prefetch-Control = "on"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
