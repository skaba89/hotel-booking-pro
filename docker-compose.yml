services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_booking_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hotel-booking-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hotel-booking-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hotel_booking_pro?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # PORT must match EXPOSE in Dockerfile (4000) and nginx upstream api:4000
      PORT: '4000'
      # Forward secrets from the host .env or docker-compose env_file
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production-32-chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Load optional host .env file — docker compose ignores missing env_file
    # when required: false (compose spec 3.x extension).
    env_file:
      - path: .env
        required: false
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser hits /api/* which nginx proxies — keep the internal URL
        # (api:4000) here for SSR; the public-facing URL goes via nginx.
        NEXT_PUBLIC_API_URL: http://api:4000
    container_name: hotel-booking-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
      NODE_ENV: production
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  nginx:
    image: nginx:alpine
    container_name: hotel-booking-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

  # One-shot DB seed — run with: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hotel-booking-seed
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hotel_booking_pro?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'npx prisma db seed']
    profiles:
      - setup

volumes:
  postgres_data:
  redis_data:
  uploads_data:
